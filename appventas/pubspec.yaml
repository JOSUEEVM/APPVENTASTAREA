name: appventas
description: App de ventas con productos, clientes y ventas
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # UI
  cupertino_icons: ^1.0.6

  # Cámara y galería
  image_picker: ^1.0.7

  # Ubicación GPS
  geolocator: ^11.0.0

  # Formato de fechas y números
  intl: ^0.19.0

  # Base de datos local
  sqflite: ^2.3.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/