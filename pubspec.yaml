name: appventas
description: App de ventas con productos, clientes y ventas
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Cámara y galería
  image_picker: ^1.0.7

  # Ubicación GPS
  geolocator: ^11.0.0

  # Formato de fechas y números
  intl: ^0.19.0

  # Base de datos local (opcional pero recomendado)
  sqflite: ^2.3.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
